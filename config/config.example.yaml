# ════════════════════════════════════════════════════════════════════════════
# FUSIONN-MUSE CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════
# Subtitle transcription and translation pipeline for qBittorrent

server:
  port: 8080

# Skip transcription & translation for testing file workflow
dry_run: false

# Host ASR + container PySubtrans Custom Server.
# Configure the MLX host and path mapping below. VideoCaptioner/empty legacy
# providers no longer execute; old snapshots require explicit current-settings recovery.
pipeline:
  provider: "mlx_qwen3_asr"

# ─────────────────────────────────────────────────────────────────────────────
# MLX QWEN3 ASR (Host Transcription)
# ─────────────────────────────────────────────────────────────────────────────
# Used only when pipeline.provider is "mlx_qwen3_asr".
# host_asr_server.py runs on macOS and executes mlx-qwen3-asr against mapped paths.
mlx_qwen3_asr:
  server_url: "http://host.docker.internal:8766"
  host_prefix: "/path/on/mac/that/maps-to-data"
  container_prefix: "/data"
  model: "Qwen/Qwen3-ASR-1.7B"
  language: ""
  timeout_minutes: 180

# ─────────────────────────────────────────────────────────────────────────────
# TRANSLATE (Shared LLM endpoint and model settings)
# ─────────────────────────────────────────────────────────────────────────────
# mlx_qwen3_asr uses PySubtrans Custom Server with endpoint/model/key/target/instruction.
#
# Providers (all OpenAI-compatible):
#   - "openai"       : OpenAI API (gpt-4o, gpt-4o-mini, etc.)
#   - "deepseek"     : DeepSeek API (deepseek-chat, deepseek-reasoner)
#   - "siliconcloud" : SiliconCloud (Qwen, Yi, DeepSeek models)
#   - "openrouter"   : OpenRouter (access to many models)
#   - "groq"         : Groq (fast inference)
#   - "together"     : Together AI
#   - "fireworks"    : Fireworks AI
#   - "custom"       : Custom OpenAI-compatible endpoint
translate:
  # Provider
  provider: "openai"

  # Model (depends on provider)
  model: "gpt-4o-mini"

  # API key
  api_key: ""

  # Target language for translation
  # Options: "Simplified Chinese", "Traditional Chinese", "English", "Japanese",
  #          "Korean", "French", "German", "Spanish", "Russian", etc.
  target_lang: "Simplified Chinese"

  # ─── Custom endpoint (only for provider: "custom") ───
  # Server URL (e.g., "http://localhost:1234"; PySubtrans endpoints usually include /v1)
  custom_server: ""

  # Custom instruction/prompt for translation (optional)
  # Use for terminology, style guidance, or domain-specific instructions
  # Examples:
  #   - "Preserve Japanese honorifics like -san, -kun, -chan"
  #   - "Technical terms: API=接口, server=服务器"
  #   - "Use formal language style"
  instruction: ""

# PySubtrans wrapper settings.
# Used only when pipeline.provider is "mlx_qwen3_asr"; LLM endpoint/model/key/target/instruction
# still come from translate.* above.
llm_subtrans:
  timeout_minutes: 180
  # Successful translation request pacing, in requests/minute (RPM).
  # 0 disables pacing. This is not an HTTP timeout or a global proxy limit;
  # internal HTTP retries are not individually paced by PySubtrans.
  rate_limit: 0

# ─────────────────────────────────────────────────────────────────────────────
# SUBTITLE (Output Settings)
# ─────────────────────────────────────────────────────────────────────────────
# Configure how subtitle files are named for media server compatibility.
subtitle:
  # Language suffix for generated subtitle files
  # Media servers (Emby, Jellyfin, Plex) use this to identify subtitle languages
  #
  # Examples:
  #   "zh-CN"    → movie.zh-CN.srt (Simplified Chinese, ISO 639-1)
  #   "zh-TW"    → movie.zh-TW.srt (Traditional Chinese)
  #   "chi"      → movie.chi.srt (ISO 639-2)
  #   "chs"      → movie.chs.srt (Common alternative)
  #   "en"       → movie.en.srt (English)
  #   ""         → movie.srt (no suffix, backwards compatible)
  #
  # Leave empty for no suffix (default behavior)
  language_suffix: ""

# Detect burned-in subtitles after filename, sidecar, and embedded subtitle checks fail.
# Approximates sufficient Chinese subtitle coverage with CJK hits across multiple time regions,
# excluding text lines containing Japanese kana.
# OCR failures fall back to normal transcription.
hard_sub_ocr:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# QUEUE
# ─────────────────────────────────────────────────────────────────────────────
queue:
  # Durable SQLite state. Keep this path on persistent storage.
  db_path: "/data/automation/meta/fusionn-muse.db"
  # Maximum total translation attempts before marking the job as failed.
  # Transcription failures are not retried automatically.
  max_retries: 4

  # Delay between retries (milliseconds)
  retry_delay_ms: 10000

# ─────────────────────────────────────────────────────────────────────────────
# APPRISE (Notifications)
# ─────────────────────────────────────────────────────────────────────────────
apprise:
  enabled: false
  base_url: "http://apprise:8000"
  key: "apprise"
  tag: "fusionn-muse"
# ════════════════════════════════════════════════════════════════════════════
# DOCKER SETUP
# ════════════════════════════════════════════════════════════════════════════
#
# docker run -d \
#   -p 8080:8080 \
#   -v /path/to/downloads:/data/torrents:ro \
#   -v /path/to/automation:/data/automation \
#   -v ./config.yaml:/app/config/config.yaml:ro \
#   fusionn-muse
#
# Folder structure:
#   /data/torrents              - Input: torrent download folder (read-only)
#   /data/automation/staging    - Internal: queue before processing
#   /data/automation/processing - Internal: active processing
#   /data/automation/scraping   - Output: videos ready for scraping
#   /data/automation/subtitles  - Output: translated subtitles
#   /data/automation/transcriptions - Durable source subtitles for retranslation
#   /data/automation/meta/fusionn-muse.db - Durable job and attempt state
#   /data/automation/failed     - Failed jobs (for manual inspection)
#
# ════════════════════════════════════════════════════════════════════════════
# QBITTORRENT SETUP
# ════════════════════════════════════════════════════════════════════════════
#
# Options → Downloads → Run external program on completion:
#   /path/to/torrent-complete.sh "%F" "%N" "%L"
#
# torrent-complete.sh:
#   #!/bin/bash
#   curl -X POST http://fusionn-muse:8080/api/v1/webhook/torrent \
#     -H "Content-Type: application/json" \
#     -d "{\"path\": \"$1\", \"name\": \"$2\", \"category\": \"$3\"}"
#
# ════════════════════════════════════════════════════════════════════════════
# API ENDPOINTS
# ════════════════════════════════════════════════════════════════════════════
#
# POST /api/v1/webhook/torrent     - qBittorrent completion callback
# GET  /api/v1/queue               - List all jobs
# GET  /api/v1/queue/stats         - Queue statistics
# GET  /api/v1/queue/:id           - Get job details
# POST /api/v1/jobs/:id/retry      - Retry a failed job
# POST /api/v1/jobs/:id/resume     - Resume an interrupted job
# POST /api/v1/jobs/:id/retranslate - Translate again from the persisted source subtitle
# POST /api/v1/retry/staging       - Re-queue all staging files
# POST /api/v1/retry/failed        - Re-queue all failed files
# POST /api/v1/retry/failed/:name  - Re-queue specific failed file
# GET  /api/v1/files/staging       - List staging files
# GET  /api/v1/files/failed        - List failed files
#
# ════════════════════════════════════════════════════════════════════════════
