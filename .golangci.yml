version: "2"

run:
  modules-download-mode: readonly
  go: "1.23"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam # Too strict
        - rangeValCopy # Allow value copies in range loops
        - unnamedResult # Not enforcing named results
        - ifElseChain # Allow if-else chains
        - unnecessaryBlock # Allow grouped blocks (common in Gin routes)
        - octalLiteral # Allow old-style octal

    govet:
      disable:
        - inline # Go 1.27 stdlib aliases cannot be replaced while supporting Go 1.23.

    misspell:
      locale: US

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes:
        - github.com/fusionn-air

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
